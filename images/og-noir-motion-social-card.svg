<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0A0D" />
      <stop offset="1" stop-color="#15151D" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(910 90) rotate(115) scale(400 470)">
      <stop stop-color="#6942FF" stop-opacity="0.9" />
      <stop offset="1" stop-color="#6942FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9D9E8" stop-opacity="0.45" />
      <stop offset="1" stop-color="#D9D9E8" stop-opacity="0.05" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <style>
      .title {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-size: 96px;
        font-weight: 800;
        letter-spacing: 2px;
        fill: #F4F4FA;
      }
      .subtitle {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-size: 44px;
        font-weight: 500;
        letter-spacing: 0.5px;
        fill: #C7C7D8;
      }
      .eyebrow {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 5px;
        fill: #8E8EA8;
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g opacity="0.35">
    <line x1="70" y1="92" x2="500" y2="92" stroke="url(#line)" stroke-width="2" />
    <line x1="70" y1="540" x2="1090" y2="540" stroke="url(#line)" stroke-width="2" />
    <line x1="70" y1="92" x2="70" y2="540" stroke="url(#line)" stroke-width="2" />
  </g>

  <g filter="url(#soft)" opacity="0.45">
    <ellipse cx="985" cy="510" rx="240" ry="70" fill="#8C74FF" />
  </g>

  <g transform="translate(870 300) rotate(-24)">
    <ellipse cx="0" cy="0" rx="42" ry="20" stroke="#D7D7EA" stroke-opacity="0.45" stroke-width="8" />
    <ellipse cx="57" cy="0" rx="42" ry="20" stroke="#D7D7EA" stroke-opacity="0.42" stroke-width="8" />
    <ellipse cx="114" cy="0" rx="42" ry="20" stroke="#D7D7EA" stroke-opacity="0.39" stroke-width="8" />
    <ellipse cx="171" cy="0" rx="42" ry="20" stroke="#D7D7EA" stroke-opacity="0.36" stroke-width="8" />
    <ellipse cx="228" cy="0" rx="42" ry="20" stroke="#D7D7EA" stroke-opacity="0.33" stroke-width="8" />
  </g>

  <text class="eyebrow" x="98" y="178">URBAN STYLE 2026</text>
  <text class="title" x="96" y="300">NOIR MOTION</text>
  <text class="subtitle" x="100" y="374">Accesorios Streetwear</text>

  <rect x="96" y="420" width="315" height="8" rx="4" fill="#6A48FF" />
  <circle cx="1120" cy="96" r="6" fill="#FFFFFF" fill-opacity="0.65" />
  <circle cx="1142" cy="96" r="6" fill="#FFFFFF" fill-opacity="0.35" />
</svg>
